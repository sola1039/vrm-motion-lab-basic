<h2>动作回放</h2>
<div class="file-row"><label for="motion-file">载入动作文件</label><input id="motion-file" type="file" accept=".json,.motion.json"><button id="load-sample">载入播放验证样例</button></div>
<fieldset id="player-controls" disabled>
  <div class="motion-heading"><strong id="motion-name">尚未载入动作</strong><span id="motion-state">已暂停</span></div>
  <label for="motion-seek">动作时间轴</label><output id="motion-position">0.000 / 0.000秒</output>
  <input id="motion-seek" type="range" min="0" max="0" step="0.001" value="0">
  <div class="player-buttons"><button id="play-pause">播放</button><button id="motion-prev">上一帧</button><button id="motion-next">下一帧</button><button id="motion-stop">回到开头</button></div>
  <div class="player-options"><label for="motion-time">定位秒数</label><input id="motion-time" type="number" min="0" max="0" step="0.001" value="0"><label for="motion-speed">播放速度</label><select id="motion-speed"><option value="0.5">0.5倍</option><option value="1" selected>1倍</option><option value="1.5">1.5倍</option><option value="2">2倍</option></select><label class="loop-switch"><input id="motion-loop" type="checkbox">循环播放</label></div>
  <div class="motion-meta"><span id="motion-frame">左侧关键帧: 0 / 0</span><span id="motion-loop-count">循环次数: 0</span></div>
</fieldset>
<p id="motion-message" class="small muted">载入标准动作文件或验证样例. 文件最大32MiB.</p>
<p id="loop-note" class="small muted">拖动定位或逐帧会暂停. 播放时暂停后可检查关节.</p>
